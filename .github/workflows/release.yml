name: Eureka Server Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Read Version
        id: version
        run: |
          echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Build Spring Boot Application
        run: ./mvnw clean package -Drevision=${{ env.VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/interviewmate-org/eureka-server:${{ env.VERSION }} .

      - name: Push Docker Image
        run: |
          docker push \
          ghcr.io/interviewmate-org/eureka-server:${{ env.VERSION }}

      - name: Increment Patch Version
        run: |
          VERSION=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$((patch + 1))
          NEW_VERSION="$major.$minor.$patch-SNAPSHOT"
          echo $NEW_VERSION > VERSION

      - name: Commit Next Snapshot Version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add VERSION
          git commit -m "chore: bump version to next snapshot"

          git push